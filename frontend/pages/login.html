<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">💪</div>
                <h1>Gym Management</h1>
                <p>Manage your fitness journey</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="tab-btn active" data-tab="login">Login</button>
                <button type="button" class="tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" class="form-input" required placeholder="Enter your password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regFirstName">First Name</label>
                        <input type="text" id="regFirstName" name="first_name" class="form-input" required placeholder="First name" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="regLastName">Last Name</label>
                        <input type="text" id="regLastName" name="last_name" class="form-input" required placeholder="Last name" autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" class="form-input" required placeholder="Choose a username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" class="form-input" required placeholder="Create a password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div id="authMessage" class="message"></div>
        </div>
    </div>

    <!-- MongoDB API Configuration -->
    <script src="/js/mongoApi.js"></script>
    <script>
        // Tab switching functionality
        document.addEventListener('DOMContentLoaded', () => {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const authForms = document.querySelectorAll('.auth-form');
            
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.dataset.tab;
                    
                    // Update active tab button
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Show corresponding form
                    authForms.forEach(form => {
                        form.classList.remove('active');
                        if (form.id === `${targetTab}Form`) {
                            form.classList.add('active');
                        }
                    });
                    
                    // Clear message
                    const messageEl = document.getElementById('authMessage');
                    messageEl.className = 'message';
                    messageEl.style.display = 'none';
                });
            });

            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const messageEl = document.getElementById('authMessage');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                
                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                try {
                    // Use Firebase authentication
                    const email = formData.get('email');
                    const password = formData.get('password');
                    
                    const result = await authAPI.login({ email, password });
                    
                    // Store user data in localStorage for session management
                    localStorage.setItem('user', JSON.stringify(result.user));
                    localStorage.setItem('token', result.token);
                    
                    // Show success message
                    messageEl.textContent = 'Login successful! Redirecting...';
                    messageEl.className = 'message success';
                    messageEl.style.display = 'block';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/pages/dashboard.html';
                    }, 1500);
                } catch (error) {
                    messageEl.textContent = error.message || 'Login failed. Please try again.';
                    messageEl.className = 'message error';
                    messageEl.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // Register form submission
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const messageEl = document.getElementById('authMessage');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                
                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                try {
                    // Use Firebase authentication
                    const userData = {
                        first_name: formData.get('first_name'),
                        last_name: formData.get('last_name'),
                        username: formData.get('username'),
                        email: formData.get('email'),
                        password: formData.get('password')
                    };
                    
                    const result = await authAPI.register(userData);
                    
                    // Store user data in localStorage for session management
                    localStorage.setItem('user', JSON.stringify(result.user));
                    localStorage.setItem('token', result.token);
                    
                    // Show success message
                    messageEl.textContent = 'Registration successful! Redirecting...';
                    messageEl.className = 'message success';
                    messageEl.style.display = 'block';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/pages/dashboard.html';
                    }, 1500);
                } catch (error) {
                    messageEl.textContent = error.message || 'Registration failed. Please try again.';
                    messageEl.className = 'message error';
                    messageEl.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
