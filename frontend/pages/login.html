<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">💪</div>
                <h1>Gym Management</h1>
                <p>Manage your fitness journey</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="tab-btn active" data-tab="login">Login</button>
                <button type="button" class="tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" class="form-input" required placeholder="Enter your password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regFirstName">First Name</label>
                        <input type="text" id="regFirstName" name="first_name" class="form-input" required placeholder="First name" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="regLastName">Last Name</label>
                        <input type="text" id="regLastName" name="last_name" class="form-input" required placeholder="Last name" autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" class="form-input" required placeholder="Choose a username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" class="form-input" required placeholder="Create a password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div id="authMessage" class="message"></div>
        </div>
    </div>

    <!-- Load localStorage API -->
    <script src="/js/localStorageApi.js"></script>
    <script>
        // Tab switching functionality
        document.addEventListener('DOMContentLoaded', () => {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const authForms = document.querySelectorAll('.auth-form');
            
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.dataset.tab;
                    
                    // Update active tab button
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Show corresponding form
                    authForms.forEach(form => {
                        form.classList.remove('active');
                        if (form.id === `${targetTab}Form`) {
                            form.classList.add('active');
                        }
                    });
                    
                    // Clear message
                    const messageEl = document.getElementById('authMessage');
                    messageEl.className = 'message';
                    messageEl.style.display = 'none';
                });
            });

            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const messageEl = document.getElementById('authMessage');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                
                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                try {
                    // Simulate API call with localStorage
                    const email = formData.get('email');
                    const password = formData.get('password');
                    
                    // Get users from localStorage
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    
                    // Find user
                    const user = users.find(u => u.email === email && u.password === password);
                    
                    if (user) {
                        // Create token (simple simulation)
                        const token = btoa(`${user.email}:${Date.now()}`);
                        
                        // Store user data
                        localStorage.setItem('user', JSON.stringify({
                            id: user.id,
                            email: user.email,
                            first_name: user.first_name,
                            last_name: user.last_name,
                            username: user.username
                        }));
                        localStorage.setItem('token', token);
                        
                        // Show success message
                        messageEl.textContent = 'Login successful! Redirecting...';
                        messageEl.className = 'message success';
                        messageEl.style.display = 'block';
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/pages/dashboard.html';
                        }, 1500);
                    } else {
                        throw new Error('Invalid email or password');
                    }
                } catch (error) {
                    messageEl.textContent = error.message || 'Login failed. Please try again.';
                    messageEl.className = 'message error';
                    messageEl.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // Register form submission
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const messageEl = document.getElementById('authMessage');
                const submitBtn = e.target.querySelector('button[type="submit"]');
                
                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                
                try {
                    // Get form data
                    const first_name = formData.get('first_name');
                    const last_name = formData.get('last_name');
                    const username = formData.get('username');
                    const email = formData.get('email');
                    const password = formData.get('password');
                    
                    // Get existing users
                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    
                    // Check if user already exists
                    if (users.find(u => u.email === email)) {
                        throw new Error('Email already registered');
                    }
                    
                    if (users.find(u => u.username === username)) {
                        throw new Error('Username already taken');
                    }
                    
                    // Create new user
                    const newUser = {
                        id: Date.now().toString(),
                        first_name,
                        last_name,
                        username,
                        email,
                        password,
                        created_at: new Date().toISOString()
                    };
                    
                    // Save user
                    users.push(newUser);
                    localStorage.setItem('users', JSON.stringify(users));
                    
                    // Show success message
                    messageEl.textContent = 'Registration successful! Please login.';
                    messageEl.className = 'message success';
                    messageEl.style.display = 'block';
                    
                    // Switch to login tab
                    setTimeout(() => {
                        document.querySelector('[data-tab="login"]').click();
                    }, 1500);
                } catch (error) {
                    messageEl.textContent = error.message || 'Registration failed. Please try again.';
                    messageEl.className = 'message error';
                    messageEl.style.display = 'block';
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
